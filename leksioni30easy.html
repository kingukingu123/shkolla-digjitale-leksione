<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Greeting Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"] {
      padding: 8px 12px;
      font-size: 16px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #007bff;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <form id="greetingForm">
    <!-- Name Input Field -->
    <div class="form-group">
      <label for="nameInput">Name</label>
      <input type="text" id="nameInput" placeholder="Enter your name" autocomplete="off">
    </div>

    <!-- Age Input Field -->
    <div class="form-group">
      <label for="ageInput">Age</label>
      <input type="text" id="ageInput" placeholder="Enter your age" autocomplete="off">
    </div>

    <!-- Submit Button -->
    <button type="submit">Submit</button>
  </form>

  <script>
    const form = document.getElementById('greetingForm');
    const nameInput = document.getElementById('nameInput');
    const ageInput = document.getElementById('ageInput');

    form.addEventListener('submit', (e) => {
      e.preventDefault(); // Prevents the default page reload behavior

      const name = nameInput.value.trim();
      const age = ageInput.value.trim();

      // Basic check to ensure fields aren't empty before showing the alert
      if (name && age) {
        alert(`Hello ${name}, you are ${age} years old!`);
      } else {
        alert('Please fill in both fields.');
      }
    });
  </script>

</body>
</html>
