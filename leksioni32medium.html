<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Information Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 600px;
    }

    .form-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    label {
      font-weight: bold;
      width: 60px;
    }

    input[type="text"] {
      padding: 8px 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }

    input[type="text"].invalid {
      border-color: #d9534f;
    }

    .error-message {
      color: #d9534f;
      font-size: 14px;
      display: none; /* Hidden by default */
    }

    .error-message.visible {
      display: inline;
    }

    button {
      width: fit-content;
      padding: 8px 16px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <form id="userForm" novalidate>
    <!-- Name Field -->
    <div class="form-group">
      <label for="userName">Name:</label>
      <input type="text" id="userName" name="userName" placeholder="Enter your name" autocomplete="off">
      <span id="nameError" class="error-message" aria-live="polite">Only letters and spaces are allowed.</span>
    </div>

    <!-- Age Field -->
    <div class="form-group">
      <label for="userAge">Age:</label>
      <input type="text" id="userAge" name="userAge" placeholder="Enter your age" autocomplete="off">
      <span id="ageError" class="error-message" aria-live="polite">Only numbers are allowed.</span>
    </div>

    <button type="submit">Submit</button>
  </form>

  <script>
    const form = document.getElementById('userForm');
    const nameInput = document.getElementById('userName');
    const ageInput = document.getElementById('userAge');
    const nameError = document.getElementById('nameError');
    const ageError = document.getElementById('ageError');

    // Regular expressions for validation
    const lettersOnlyRegex = /^[A-Za-z\s]*$/;
    const numbersOnlyRegex = /^[0-9]*$/;

    // Real-time validation for Name
    function validateName() {
      const value = nameInput.value;
      if (!lettersOnlyRegex.test(value)) {
        nameError.textContent = 'Only letters and spaces are allowed.';
        nameError.classList.add('visible');
        nameInput.classList.add('invalid');
        return false;
      } else {
        nameError.classList.remove('visible');
        nameInput.classList.remove('invalid');
        return true;
      }
    }

    // Real-time validation for Age
    function validateAge() {
      const value = ageInput.value;
      if (!numbersOnlyRegex.test(value)) {
        ageError.textContent = 'Only numbers are allowed.';
        ageError.classList.add('visible');
        ageInput.classList.add('invalid');
        return false;
      } else {
        ageError.classList.remove('visible');
        ageInput.classList.remove('invalid');
        return true;
      }
    }

    // Attach real-time input listeners
    nameInput.addEventListener('input', validateName);
    ageInput.addEventListener('input', validateAge);

    // Form submission validation
    form.addEventListener('submit', (e) => {
      e.preventDefault(); // Prevent page reload

      const isNameSyntaxValid = validateName();
      const isAgeSyntaxValid = validateAge();

      // Remember: inputs are strings, so we trim them to check for emptiness on submit
      const nameValue = nameInput.value.trim();
      const ageValue = ageInput.value.trim();

      let isFormValid = true;

      if (!isNameSyntaxValid || nameValue === '') {
        nameError.textContent = nameValue === '' ? 'Name is required.' : 'Only letters and spaces are allowed.';
        nameError.classList.add('visible');
        nameInput.classList.add('invalid');
        isFormValid = false;
      }

      if (!isAgeSyntaxValid || ageValue === '') {
        ageError.textContent = ageValue === '' ? 'Age is required.' : 'Only numbers are allowed.';
        ageError.classList.add('visible');
        ageInput.classList.add('invalid');
        isFormValid = false;
      }

      if (isFormValid) {
        alert('Form submitted successfully!');
        // Proceed with form data processing here
      }
    });
  </script>

</body>
</html>
